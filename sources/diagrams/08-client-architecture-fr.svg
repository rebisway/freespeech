<svg viewBox="0 0 830 396" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono',ui-monospace,Consolas,monospace" role="img" aria-label="Les interfaces (console, mobile, desktop) appellent FreeSpeechClient, qui orchestre les services ; tout est stocké dans une base SQLite dont le contenu est chiffré avec une clé issue des trois phrases">
  <rect x="0" y="0" width="830" height="396" fill="#ffffff"/>
  <style>
    .lbl{font-size:11px;fill:#6b665d;font-family:'IBM Plex Mono',monospace}
    .lbl-strong{font-size:11.5px;fill:#1c1a17;font-weight:600;font-family:'IBM Plex Mono',monospace}
    .actor{font-size:12.5px;fill:#1c1a17;font-weight:600;font-family:'IBM Plex Mono',monospace}
    .col{font-size:10.5px;fill:#1c1a17;font-family:'IBM Plex Mono',monospace}
    .key{font-size:10.5px;fill:#a8501f;font-family:'IBM Plex Mono',monospace;font-weight:600}
  </style>  <text x="20" y="24" class="actor">Interfaces (aucune logique de protocole)</text>
  <rect x="20" y="34" width="150" height="40" rx="6" fill="none" stroke="#4a5a8a" stroke-width="1.6"/>
  <text x="95" y="59" class="lbl-strong" text-anchor="middle">Console (REPL)</text>
  <rect x="190" y="34" width="150" height="40" rx="6" fill="none" stroke="#4a5a8a" stroke-width="1.6"/>
  <text x="265" y="59" class="lbl-strong" text-anchor="middle">Mobile (MAUI)</text>
  <rect x="360" y="34" width="150" height="40" rx="6" fill="none" stroke="#4a5a8a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="435" y="59" class="lbl-strong" text-anchor="middle">Desktop (à venir)</text>

  <path d="M95 76 L95 104 M265 76 L265 104 M435 76 L435 104" stroke="#4a5a8a" stroke-width="1.4" fill="none" marker-end="url(#aB)"/>
  <text x="540" y="62" class="lbl">Elles appellent des méthodes et écoutent</text>
  <text x="540" y="76" class="lbl">des événements (MessageReceived, Notice...).</text>

  <rect x="20" y="108" width="490" height="62" rx="8" fill="#dff0ef" stroke="#2f6f6e" stroke-width="1.8"/>
  <text x="265" y="130" class="actor" text-anchor="middle">FreeSpeechClient</text>
  <text x="265" y="148" class="lbl" text-anchor="middle">envoyer - répondre - transférer - téléverser - télécharger</text>
  <text x="265" y="162" class="lbl" text-anchor="middle">historique paginé - lu/non lu - contacts - archives - profil - groupes - backup</text>

  <path d="M265 172 L265 196" stroke="#2f6f6e" stroke-width="1.4" fill="none" marker-end="url(#aT)"/>

  <rect x="20" y="200" width="490" height="62" rx="8" fill="none" stroke="#1c1a17" stroke-width="1.2"/>
  <text x="30" y="218" class="lbl-strong">Services</text>
  <text x="30" y="234" class="col">RelayPool   ContactExchange   AttachmentService</text>
  <text x="30" y="249" class="col">GroupService   BackupService   BackgroundScheduler</text>

  <path d="M150 264 L150 290 M410 264 L410 290" stroke="#1c1a17" stroke-width="1.2" fill="none" marker-end="url(#aB)"/>

  <rect x="20" y="294" width="270" height="62" rx="8" fill="none" stroke="#2f6f6e" stroke-width="1.6"/>
  <text x="30" y="312" class="lbl-strong">ClientDatabase</text>
  <text x="30" y="328" class="col">SQLite + Vault (freespeech.db)</text>
  <text x="30" y="343" class="lbl">identité, contacts, groupes, historique, lu/non lu</text>

  <rect x="310" y="294" width="200" height="62" rx="8" fill="none" stroke="#a8501f" stroke-width="1.6"/>
  <text x="320" y="312" class="lbl-strong">attachments/</text>
  <text x="320" y="328" class="col">blobs trees parts out in</text>
  <text x="320" y="343" class="lbl">en clair (choix acté)</text>

  <rect x="570" y="108" width="240" height="80" rx="8" fill="none" stroke="#a8501f" stroke-width="1.6"/>
  <text x="580" y="128" class="lbl-strong">Serveurs</text>
  <text x="580" y="146" class="lbl">WebSocket + JSON</text>
  <text x="580" y="160" class="lbl">relais : jamais le contenu</text>
  <text x="580" y="174" class="lbl">N serveurs en parallèle (§8)</text>
  <path d="M512 130 L566 130" stroke="#a8501f" stroke-width="1.6" fill="none" marker-end="url(#aR)"/>

  <rect x="570" y="294" width="240" height="62" rx="8" fill="none" stroke="#4a5a8a" stroke-width="1.6"/>
  <text x="580" y="312" class="lbl-strong">IKeyCache</text>
  <text x="580" y="328" class="col">DPAPI / Keychain / Keystore</text>
  <text x="580" y="343" class="lbl">clé de la base, mise en cache</text>
  <path d="M690 358 L690 378 L155 378 L155 358" stroke="#4a5a8a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#aB)"/>
  <text x="420" y="391" class="lbl" text-anchor="middle">ouvre la base au démarrage (sinon : ressaisir les phrases)</text>

  <text x="580" y="238" class="lbl-strong">3 phrases de récupération</text>
  <text x="580" y="254" class="lbl">-> identité (X25519 / Ed25519)</text>
  <text x="580" y="268" class="lbl">-> clé de la base (HKDF database-v1)</text>
  <text x="580" y="282" class="lbl">-> clé du backup</text>  <defs>
    <marker id="aT" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#2f6f6e"/></marker>
    <marker id="aB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#4a5a8a"/></marker>
    <marker id="aR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#a8501f"/></marker>
  </defs>
</svg>