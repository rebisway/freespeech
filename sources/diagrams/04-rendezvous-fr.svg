<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono',ui-monospace,Consolas,monospace" role="img" aria-label="A a un message pour B qui est hors ligne ; A pose un flag WAITING ; B se reconnecte, voit le flag, répond READY avec une heure de rendez-vous ; les deux se connectent à cette heure et le message est livré">
  <rect x="0" y="0" width="860" height="300" fill="#ffffff"/>
  <style>
    .lbl{font-size:11px;fill:#6b665d;font-family:'IBM Plex Mono',monospace}
    .lbl-strong{font-size:11.5px;fill:#1c1a17;font-weight:600;font-family:'IBM Plex Mono',monospace}
    .actor{font-size:12.5px;fill:#1c1a17;font-weight:600;font-family:'IBM Plex Mono',monospace}
  </style>
  <text x="80" y="30" class="actor">A</text>
  <text x="420" y="30" class="actor" text-anchor="middle">Serveur — flag (from,to)</text>
  <text x="760" y="30" class="actor" text-anchor="end">B</text>
  <line x1="80" y1="45" x2="80" y2="290" stroke="#1c1a17" opacity="0.25"/>
  <line x1="420" y1="45" x2="420" y2="290" stroke="#1c1a17" opacity="0.25"/>
  <line x1="760" y1="45" x2="760" y2="290" stroke="#1c1a17" opacity="0.25"/>

  <rect x="700" y="55" width="120" height="22" rx="4" fill="#f6e6db"/>
  <text x="760" y="70" class="lbl" text-anchor="middle" fill="#a8501f">hors ligne</text>

  <path d="M80 95 L414 95" fill="none" stroke="#a8501f" stroke-width="1.6" marker-end="url(#arrowWarn2)"/>
  <text x="250" y="87" class="lbl" text-anchor="middle">POST /flags {A→B, WAITING}</text>

  <path d="M700 130 L426 130" fill="none" stroke="#1c1a17" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowInk2)"/>
  <text x="580" y="122" class="lbl" text-anchor="middle">B se reconnecte, poll GET /flags/B</text>

  <path d="M414 155 L86 155" fill="none" stroke="#a8501f" stroke-width="1.6" marker-end="url(#arrowWarn2)"/>
  <text x="250" y="147" class="lbl" text-anchor="middle" opacity="0.8">(B lit le WAITING de A)</text>

  <path d="M700 180 L426 180" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc2)"/>
  <text x="580" y="172" class="lbl" text-anchor="middle">POST /flags {B→A, READY, next_connect_at=T}</text>

  <path d="M414 205 L86 205" fill="none" stroke="#1c1a17" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowInk2)"/>
  <text x="250" y="197" class="lbl" text-anchor="middle">A poll, voit READY(T), programme un réveil à T-10s</text>

  <rect x="380" y="225" width="80" height="24" rx="4" fill="#dff0ef"/>
  <text x="420" y="242" class="lbl-strong" text-anchor="middle" fill="#2f6f6e">T</text>

  <path d="M80 260 L760 260" fill="none" stroke="#2f6f6e" stroke-width="1.8" marker-end="url(#arrowAcc2)"/>
  <text x="420" y="252" class="lbl" text-anchor="middle">les deux connectés à T → message livré → ACK → flags supprimés</text>

  <defs>
    <marker id="arrowWarn2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#a8501f"/></marker>
    <marker id="arrowAcc2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#2f6f6e"/></marker>
    <marker id="arrowInk2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#1c1a17"/></marker>
  </defs>
  <text x="20" y="290" font-family="'IBM Plex Sans',sans-serif" font-size="12" fill="#6b665d">Flag stocké par paire (from,to), une entrée à la fois — d'où la limite multi-device (schéma 02).</text>
</svg>
