<svg viewBox="0 0 980 480" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono',ui-monospace,Consolas,monospace" role="img" aria-label="Moving a client: the full server asks its siblings, suggests server_redirect, the client registers on the new server then tells its contacts">
  <rect x="0" y="0" width="980" height="480" fill="#ffffff"/>
  <style>
    .lbl{font-size:11px;fill:#6b665d;font-family:'IBM Plex Mono',monospace}
    .lbl-strong{font-size:11.5px;fill:#1c1a17;font-weight:600;font-family:'IBM Plex Mono',monospace}
    .actor{font-size:12.5px;fill:#1c1a17;font-weight:600;font-family:'IBM Plex Mono',monospace}
  </style>
  <text x="110" y="30" class="actor" text-anchor="middle">Client</text>
  <text x="360" y="30" class="actor" text-anchor="middle">Full server</text>
  <text x="610" y="30" class="actor" text-anchor="middle">Sibling server</text>
  <text x="860" y="30" class="actor" text-anchor="middle">Contacts / groups</text>
  <line x1="110" y1="45" x2="110" y2="440" stroke="#1c1a17" opacity="0.25"/>
  <line x1="360" y1="45" x2="360" y2="440" stroke="#1c1a17" opacity="0.25"/>
  <line x1="610" y1="45" x2="610" y2="440" stroke="#1c1a17" opacity="0.25"/>
  <line x1="860" y1="45" x2="860" y2="440" stroke="#1c1a17" opacity="0.25"/>
  <path d="M356 70 L114 70" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <text x="235" y="63" class="lbl" text-anchor="middle">registered</text>
  <rect x="288" y="82" width="143" height="24" rx="4" fill="#dff0ef"/>
  <text x="360" y="98" class="lbl-strong" text-anchor="middle">over MaxConnections</text>
  <path d="M364 135 L606 135" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <text x="485" y="128" class="lbl" text-anchor="middle">POST /s2s/capacity (signed)</text>
  <path d="M606 165 L364 165" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <text x="485" y="158" class="lbl" text-anchor="middle">{free_slots: n}</text>
  <rect x="160" y="180" width="401" height="24" rx="4" fill="#dff0ef"/>
  <text x="360" y="196" class="lbl-strong" text-anchor="middle">drops the full ones, weighted draw, 3 at most (15 s cache)</text>
  <path d="M356 245 L114 245" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <text x="235" y="238" class="lbl" text-anchor="middle">server_redirect {servers, reason}</text>
  <rect x="123" y="258" width="414" height="24" rx="4" fill="#dff0ef"/>
  <text x="330" y="274" class="lbl-strong" text-anchor="middle">follows if: one of MY servers, https, 3 times / 24 h at most</text>
  <path d="M114 320 L606 320" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <text x="360" y="313" class="lbl" text-anchor="middle">register + proof (§11)</text>
  <path d="M606 350 L114 350" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <text x="360" y="343" class="lbl" text-anchor="middle">registered</text>
  <path d="M114 400 L856 400" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <text x="485" y="393" class="lbl" text-anchor="middle">identity_update (new server, queued if offline)</text>
  <text x="20" y="462" font-family="'IBM Plex Sans',sans-serif" font-size="12" fill="#6b665d">Nothing is moved by force: with no sibling available, the client stays. A contact still writing to the old server finds the client through the S2S cascade.</text>
  <defs>
    <marker id="arrowInk" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#1c1a17"/></marker>
    <marker id="arrowAcc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#2f6f6e"/></marker>
    <marker id="arrowWarn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#a4402f"/></marker>
  </defs>
</svg>
