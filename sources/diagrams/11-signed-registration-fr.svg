<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono',ui-monospace,Consolas,monospace" role="img" aria-label="Inscription avec preuve d’identité : register, challenge, signature du nonce, vérification, registered avec le jeton HTTP">
  <rect x="0" y="0" width="860" height="340" fill="#ffffff"/>
  <style>
    .lbl{font-size:11px;fill:#6b665d;font-family:'IBM Plex Mono',monospace}
    .lbl-strong{font-size:11.5px;fill:#1c1a17;font-weight:600;font-family:'IBM Plex Mono',monospace}
    .actor{font-size:12.5px;fill:#1c1a17;font-weight:600;font-family:'IBM Plex Mono',monospace}
  </style>
  <text x="150" y="30" class="actor" text-anchor="middle">Client</text>
  <text x="710" y="30" class="actor" text-anchor="middle">Serveur</text>
  <line x1="150" y1="45" x2="150" y2="300" stroke="#1c1a17" opacity="0.25"/>
  <line x1="710" y1="45" x2="710" y2="300" stroke="#1c1a17" opacity="0.25"/>
  <path d="M154 70 L706 70" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <text x="430" y="63" class="lbl" text-anchor="middle">register {discovery_id, enc_key, sign_key}</text>
  <rect x="556" y="85" width="308" height="24" rx="4" fill="#dff0ef"/>
  <text x="710" y="101" class="lbl-strong" text-anchor="middle">SHA-256(enc_key ‖ sign_key) = discovery_id ?</text>
  <path d="M706 135 L154 135" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <text x="430" y="128" class="lbl" text-anchor="middle">challenge {nonce 32 o, usage unique}</text>
  <rect x="126" y="150" width="407" height="24" rx="4" fill="#dff0ef"/>
  <text x="330" y="166" class="lbl-strong" text-anchor="middle">signe (Ed25519) : freespeech-register-v1|nonce|discovery_id</text>
  <path d="M154 215 L706 215" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <text x="430" y="208" class="lbl" text-anchor="middle">register_proof {signature}</text>
  <rect x="522" y="228" width="157" height="24" rx="4" fill="#dff0ef"/>
  <text x="600" y="244" class="lbl-strong" text-anchor="middle">vérifie avec sign_key</text>
  <path d="M706 275 L154 275" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <text x="430" y="268" class="lbl" text-anchor="middle">registered {http_token (192 bits)}</text>
  <text x="20" y="322" font-family="'IBM Plex Sans',sans-serif" font-size="12" fill="#6b665d">Échec (clés ≠ identifiant, signature fausse, preuve sans register) : error, inscription annulée. Le nonce sert une seule fois.</text>
  <defs>
    <marker id="arrowInk" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#1c1a17"/></marker>
    <marker id="arrowAcc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#2f6f6e"/></marker>
    <marker id="arrowWarn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#a4402f"/></marker>
  </defs>
</svg>
