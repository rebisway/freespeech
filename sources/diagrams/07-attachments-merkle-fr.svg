<svg viewBox="0 0 1040 345" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono',ui-monospace,Consolas,monospace" role="img" aria-label="Un fichier est découpé en morceaux de 48 Kio, hachés en arbre de Merkle ; la racine identifie le contenu ; le destinataire télécharge les morceaux auprès de plusieurs détenteurs et vérifie chacun avec sa preuve">
  <rect x="0" y="0" width="1040" height="345" fill="#ffffff"/>
  <style>
    .lbl{font-size:11px;fill:#6b665d;font-family:'IBM Plex Mono',monospace}
    .lbl-strong{font-size:11.5px;fill:#1c1a17;font-weight:600;font-family:'IBM Plex Mono',monospace}
    .actor{font-size:12.5px;fill:#1c1a17;font-weight:600;font-family:'IBM Plex Mono',monospace}
    .col{font-size:10.5px;fill:#1c1a17;font-family:'IBM Plex Mono',monospace}
    .key{font-size:10.5px;fill:#a8501f;font-family:'IBM Plex Mono',monospace;font-weight:600}
  </style>  <text x="20" y="26" class="actor">Offre</text>
  <rect x="20" y="40" width="110" height="34" rx="6" fill="none" stroke="#1c1a17" stroke-width="1.4"/>
  <text x="75" y="61" class="lbl-strong" text-anchor="middle">fichier</text>
  <path d="M130 57 L170 57" fill="none" stroke="#1c1a17" stroke-width="1.2" marker-end="url(#aB)"/>

  <rect x="175" y="110" width="60" height="26" rx="4" fill="#dff0ef" stroke="#2f6f6e"/><text x="205" y="127" class="lbl" text-anchor="middle">H0</text>
  <rect x="245" y="110" width="60" height="26" rx="4" fill="#dff0ef" stroke="#2f6f6e"/><text x="275" y="127" class="lbl" text-anchor="middle">H1</text>
  <rect x="315" y="110" width="60" height="26" rx="4" fill="#dff0ef" stroke="#2f6f6e"/><text x="345" y="127" class="lbl" text-anchor="middle">H2</text>
  <rect x="385" y="110" width="60" height="26" rx="4" fill="#dff0ef" stroke="#2f6f6e"/><text x="415" y="127" class="lbl" text-anchor="middle">H3</text>
  <text x="310" y="156" class="lbl" text-anchor="middle">feuille = SHA256(0x00 | morceau de 48 Kio)</text>

  <rect x="210" y="70" width="60" height="26" rx="4" fill="none" stroke="#4a5a8a"/><text x="240" y="87" class="lbl" text-anchor="middle">H01</text>
  <rect x="350" y="70" width="60" height="26" rx="4" fill="none" stroke="#4a5a8a"/><text x="380" y="87" class="lbl" text-anchor="middle">H23</text>
  <path d="M205 110 L235 96 M275 110 L250 96 M345 110 L375 96 M415 110 L390 96" stroke="#6b665d" fill="none"/>

  <rect x="280" y="30" width="60" height="26" rx="4" fill="#dff0ef" stroke="#2f6f6e" stroke-width="2"/><text x="310" y="47" class="lbl-strong" text-anchor="middle">root</text>
  <path d="M240 70 L295 56 M380 70 L325 56" stroke="#6b665d" fill="none"/>

  <text x="475" y="44" class="lbl-strong">ContentId = SHA256(0x02 | size | root)</text>
  <text x="475" y="62" class="lbl">La taille est liée à la racine : un même arbre ne peut pas</text>
  <text x="475" y="76" class="lbl">être présenté avec un autre nombre de feuilles.</text>
  <text x="475" y="98" class="lbl">Message d'offre (contact ou groupe) :</text>
  <text x="475" y="112" class="lbl" opacity="0.8">{name, mime, size, root}</text>

  <text x="20" y="190" class="actor">Téléchargement en essaim</text>
  <rect x="20" y="205" width="150" height="50" rx="8" fill="none" stroke="#2f6f6e" stroke-width="1.6"/>
  <text x="95" y="226" class="actor" text-anchor="middle">Détenteur A</text>
  <text x="95" y="243" class="lbl" text-anchor="middle">morceaux 0, 2</text>

  <rect x="20" y="275" width="150" height="50" rx="8" fill="none" stroke="#2f6f6e" stroke-width="1.6"/>
  <text x="95" y="296" class="actor" text-anchor="middle">Détenteur C</text>
  <text x="95" y="313" class="lbl" text-anchor="middle">morceaux 1, 3</text>

  <rect x="520" y="235" width="170" height="60" rx="8" fill="none" stroke="#a8501f" stroke-width="1.6"/>
  <text x="605" y="258" class="actor" text-anchor="middle">Destinataire B</text>
  <text x="605" y="276" class="lbl" text-anchor="middle">assemble, vérifie la racine</text>

  <path d="M170 230 L516 255" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#aT)"/>
  <text x="340" y="232" class="lbl" text-anchor="middle">morceau + preuve</text>
  <path d="M170 300 L516 280" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#aT)"/>
  <text x="340" y="312" class="lbl" text-anchor="middle">morceau + preuve</text>

  <text x="720" y="215" class="lbl-strong">Règles</text>
  <text x="720" y="233" class="lbl">- chaque morceau est vérifié à son arrivée</text>
  <text x="720" y="248" class="lbl">- détenteur fautif : strikes puis banni</text>
  <text x="720" y="263" class="lbl">- "nohave" : part réassignée tout de suite</text>
  <text x="720" y="278" class="lbl">- reprise : seuls les morceaux manquants</text>
  <text x="720" y="293" class="lbl">- même racine = même fichier, stocké une fois</text>
  <text x="720" y="308" class="lbl">- transfert vers une autre discussion : sans copie</text>  <defs>
    <marker id="aT" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#2f6f6e"/></marker>
    <marker id="aB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#4a5a8a"/></marker>
    <marker id="aR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#a8501f"/></marker>
  </defs>
</svg>