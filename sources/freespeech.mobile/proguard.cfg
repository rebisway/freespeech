# R8 rules of the Release build. The workload generates the rules for what .NET reaches through JNI (proguard_project_references.cfg); add here a class that
# is looked up by name some other way (reflection, XML, manifest) if a Release build crashes with ClassNotFoundException / NoSuchMethodError.
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
-dontwarn javax.annotation.**
-dontwarn org.codehaus.mojo.animal_sniffer.*
-dontwarn kotlin.**
-dontwarn kotlinx.**

# .NET reads Java fields by name through JNI (field ids), and the generated rules above only keep constructors and methods: the public and protected
# fields keep their names (a field renamed here fails at run time with NoSuchFieldError).
-keepclassmembers class * {
    public <fields>;
    protected <fields>;
}

# Classes the system, or a library, finds by the name written in the manifest, in a layout or in a meta-data entry: their names stay.
-keep public class * extends android.app.Activity
-keep public class * extends android.app.Service
-keep public class * extends android.content.BroadcastReceiver
-keep public class * extends android.content.ContentProvider
-keep public class * extends android.app.Application
-keep public class * extends android.app.AppComponentFactory
-keep public class * extends android.app.backup.BackupAgent
-keep class * implements androidx.startup.Initializer { <init>(...); }
-keep class * extends androidx.work.ListenableWorker { <init>(...); }
-keep class * extends androidx.work.InputMerger { <init>(...); }

# Classes inflated from XML (layouts, drawables, themes, behaviors) are created by name: they keep their names and the constructors the inflater calls.
-keep public class * extends android.view.View {
    public <init>(android.content.Context);
    public <init>(android.content.Context, android.util.AttributeSet);
    public <init>(android.content.Context, android.util.AttributeSet, int);
    public <init>(android.content.Context, android.util.AttributeSet, int, int);
}
-keep class * extends android.graphics.drawable.Drawable { public <init>(...); }
-keep class * extends androidx.appcompat.app.AppCompatViewInflater { <init>(...); }
-keep class * extends androidx.coordinatorlayout.widget.CoordinatorLayout$Behavior { <init>(...); }
-keep class * extends androidx.fragment.app.Fragment { public <init>(); }
-keep class * extends android.view.ActionProvider { <init>(...); }
