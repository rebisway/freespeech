<svg viewBox="0 0 860 495" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono',ui-monospace,Consolas,monospace" role="img" aria-label="Dérivation de l’identité : trois phrases, Argon2id, seed, trois HKDF, clés X25519 et Ed25519, clé de base locale, discovery_id">
  <rect x="0" y="0" width="860" height="495" fill="#ffffff"/>
  <style>
    .lbl{font-size:11px;fill:#6b665d;font-family:'IBM Plex Mono',monospace}
    .lbl-strong{font-size:11.5px;fill:#1c1a17;font-weight:600;font-family:'IBM Plex Mono',monospace}
    .actor{font-size:12.5px;fill:#1c1a17;font-weight:600;font-family:'IBM Plex Mono',monospace}
  </style>
  <rect x="60" y="15" width="200" height="32" rx="5" fill="#f3efe6" stroke="#1c1a17" stroke-opacity="0.35"/>
  <text x="160" y="35" class="lbl-strong" text-anchor="middle">phrase 1</text>
  <rect x="330" y="15" width="200" height="32" rx="5" fill="#f3efe6" stroke="#1c1a17" stroke-opacity="0.35"/>
  <text x="430" y="35" class="lbl-strong" text-anchor="middle">phrase 2</text>
  <rect x="600" y="15" width="200" height="32" rx="5" fill="#f3efe6" stroke="#1c1a17" stroke-opacity="0.35"/>
  <text x="700" y="35" class="lbl-strong" text-anchor="middle">phrase 3</text>
  <path d="M160 47 L160 74" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <path d="M430 47 L430 74" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <path d="M700 47 L700 74" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <rect x="60" y="78" width="740" height="32" rx="5" fill="#f3efe6" stroke="#1c1a17" stroke-opacity="0.35"/>
  <text x="430" y="98" class="lbl-strong" text-anchor="middle">p1 ‖ 0x00 ‖ p2 ‖ 0x00 ‖ p3   (chacune sans espaces de bord, UTF-8)</text>
  <path d="M430 110 L430 131" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <rect x="60" y="135" width="740" height="44" rx="5" fill="#dff0ef" stroke="#1c1a17" stroke-opacity="0.35"/>
  <text x="430" y="153.5" class="lbl-strong" text-anchor="middle">Argon2id</text>
  <text x="430" y="168.5" class="lbl-strong" text-anchor="middle">sel fixe « FreeSpeech-v3-seed » · 32 Mio · t = 3 · p = 1 → 32 o</text>
  <path d="M430 179 L430 200" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <rect x="330" y="204" width="200" height="30" rx="5" fill="#f3efe6" stroke="#1c1a17" stroke-opacity="0.35"/>
  <text x="430" y="223" class="lbl-strong" text-anchor="middle">seed (32 B)</text>
  <path d="M160 234 L160 258" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <path d="M430 234 L430 258" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <path d="M700 234 L700 258" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <text x="442" y="253" class="lbl" text-anchor="start" opacity="0.75">HKDF-SHA256, salt « FreeSpeech-v2 »</text>
  <rect x="60" y="262" width="200" height="44" rx="5" fill="#dff0ef" stroke="#1c1a17" stroke-opacity="0.35"/>
  <text x="160" y="280.5" class="lbl-strong" text-anchor="middle">enc_seed</text>
  <text x="160" y="295.5" class="lbl-strong" text-anchor="middle">info = encryption</text>
  <rect x="330" y="262" width="200" height="44" rx="5" fill="#dff0ef" stroke="#1c1a17" stroke-opacity="0.35"/>
  <text x="430" y="280.5" class="lbl-strong" text-anchor="middle">sign_seed</text>
  <text x="430" y="295.5" class="lbl-strong" text-anchor="middle">info = signing</text>
  <rect x="600" y="262" width="200" height="44" rx="5" fill="#dff0ef" stroke="#1c1a17" stroke-opacity="0.35"/>
  <text x="700" y="280.5" class="lbl-strong" text-anchor="middle">db_key</text>
  <text x="700" y="295.5" class="lbl-strong" text-anchor="middle">info = database-v1</text>
  <path d="M160 306 L160 328" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <path d="M430 306 L430 328" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <path d="M700 306 L700 328" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <rect x="60" y="332" width="200" height="44" rx="5" fill="#f3efe6" stroke="#1c1a17" stroke-opacity="0.35"/>
  <text x="160" y="350.5" class="lbl-strong" text-anchor="middle">X25519</text>
  <text x="160" y="365.5" class="lbl-strong" text-anchor="middle">chiffrement</text>
  <rect x="330" y="332" width="200" height="44" rx="5" fill="#f3efe6" stroke="#1c1a17" stroke-opacity="0.35"/>
  <text x="430" y="350.5" class="lbl-strong" text-anchor="middle">Ed25519</text>
  <text x="430" y="365.5" class="lbl-strong" text-anchor="middle">signature</text>
  <rect x="600" y="332" width="200" height="44" rx="5" fill="#f3efe6" stroke="#1c1a17" stroke-opacity="0.35"/>
  <text x="700" y="350.5" class="lbl-strong" text-anchor="middle">base locale</text>
  <text x="700" y="365.5" class="lbl-strong" text-anchor="middle">chiffrée</text>
  <path d="M160 376 L160 396 L430 396" fill="none" stroke="#2f6f6e" stroke-width="1.6"/>
  <path d="M430 376 L430 396" fill="none" stroke="#2f6f6e" stroke-width="1.6"/>
  <path d="M430 396 L430 416" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <rect x="200" y="420" width="460" height="30" rx="5" fill="#dff0ef" stroke="#1c1a17" stroke-opacity="0.35"/>
  <text x="430" y="439" class="lbl-strong" text-anchor="middle">discovery_id = SHA-256(enc_pub ‖ sign_pub)</text>
  <text x="20" y="478" font-family="'IBM Plex Sans',sans-serif" font-size="12" fill="#6b665d">Mêmes trois phrases → même identité sur tout appareil, sans serveur. Perdues, elles ne se récupèrent pas.</text>
  <defs>
    <marker id="arrowInk" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#1c1a17"/></marker>
    <marker id="arrowAcc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#2f6f6e"/></marker>
    <marker id="arrowWarn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#a4402f"/></marker>
  </defs>
</svg>
