<svg viewBox="0 0 860 260" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono',ui-monospace,Consolas,monospace" role="img" aria-label="B sends a message to A; the server relays it to all of A's active connections; the device that receives it also forwards it to its own discovery_id so A's other device picks it up too">
  <rect x="0" y="0" width="860" height="260" fill="#ffffff"/>
  <style>
    .lbl{font-size:11px;fill:#6b665d;font-family:'IBM Plex Mono',monospace}
    .actor{font-size:12.5px;fill:#1c1a17;font-weight:600;font-family:'IBM Plex Mono',monospace}
  </style>
  <text x="40" y="30" class="actor">B</text>
  <text x="420" y="30" class="actor" text-anchor="middle">Server (registry did_A → [conn1, conn2])</text>
  <text x="760" y="30" class="actor" text-anchor="end">A · Device 1</text>
  <text x="760" y="60" class="actor" text-anchor="end">A · Device 2 (offline)</text>

  <line x1="40" y1="45" x2="40" y2="230" stroke="#1c1a17" opacity="0.25"/>
  <line x1="420" y1="45" x2="420" y2="230" stroke="#1c1a17" opacity="0.25"/>
  <line x1="760" y1="75" x2="760" y2="230" stroke="#1c1a17" opacity="0.25"/>

  <path d="M40 90 L414 90" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <text x="230" y="82" class="lbl" text-anchor="middle">message(uid, text) encrypted for A</text>

  <path d="M426 90 L754 90" fill="none" stroke="#2f6f6e" stroke-width="1.6" marker-end="url(#arrowAcc)"/>
  <text x="590" y="82" class="lbl" text-anchor="middle">relayed (conn1 active)</text>

  <rect x="700" y="100" width="60" height="24" rx="4" fill="#dff0ef"/>
  <text x="730" y="116" class="lbl" text-anchor="middle">received ✓</text>

  <path d="M700 145 Q560 170 426 145" fill="none" stroke="#4a5a8a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowDevice)"/>
  <text x="560" y="165" class="lbl" text-anchor="middle">forwards the message to did_A (self)</text>

  <path d="M414 155 Q 580 210 754 160" fill="none" stroke="#a8501f" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#arrowWarn)"/>
  <text x="580" y="205" class="lbl" text-anchor="middle">Device 2 offline → ordinary WAITING flag (§9), delivered on reconnect</text>

  <defs>
    <marker id="arrowAcc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#2f6f6e"/></marker>
    <marker id="arrowWarn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#a8501f"/></marker>
    <marker id="arrowDevice" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="#4a5a8a"/></marker>
  </defs>
  <text x="20" y="252" font-family="'IBM Plex Sans',sans-serif" font-size="12" fill="#6b665d">A single reused mechanism: Device 1 treats its own discovery_id as an ordinary contact as soon as it receives something.</text>
</svg>
